name: Build & Push Docker Image

on:
  schedule:
    - cron: '0 3 * * 0'  # Every Sunday at 03:00 UTC
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag (e.g. v1.2.3, 1.2.3, beta). Leave empty to build with branch name only."
        required: false
        type: string

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ── Schedule: fetch latest data ───────────────────────
      - name: Fetch latest data and check for changes (scheduled)
        if: github.event_name == 'schedule'
        id: changes
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile
          OLD_HASH=$(cat .data-build-hash 2>/dev/null || echo "")
          pnpm build:data
          bash scripts/build-data-hash.sh
          NEW_HASH=$(cat .data-build-hash)
          if [ "$NEW_HASH" = "$OLD_HASH" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No data changes detected, skipping build."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push updated data (scheduled)
        if: github.event_name == 'schedule' && steps.changes.outputs.has_changes == 'true'
        run: |
          bash scripts/update-readme-stats.sh
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md .data-build-hash
          git commit -m "chore(data): scheduled update $(date -u +%Y-%m-%d)"
          git push origin main

      # ── Dispatch: optionally create tag ───────────────────
      - name: Handle dispatch tag
        if: github.event_name == 'workflow_dispatch'
        id: prep
        shell: bash
        run: |
          set -euo pipefail
          TAG_INPUT="${{ inputs.tag }}"
          if [[ -z "$TAG_INPUT" ]]; then
            echo "::notice::No semver provided, tags will be branch name only."
            echo "has_tag=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG="$TAG_INPUT"
          if [[ ! "$TAG" =~ ^v ]]; then TAG="v$TAG"; fi

          if git ls-remote --tags --exit-code origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $TAG" >&2; exit 1
          fi

          echo "tag=$TAG"     >> "$GITHUB_OUTPUT"
          echo "has_tag=true" >> "$GITHUB_OUTPUT"

          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION="${TAG#v}"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "is_semver=true"   >> "$GITHUB_OUTPUT"
            node -e "const fs=require('fs');const p='package.json';const j=JSON.parse(fs.readFileSync(p,'utf8'));j.version='$VERSION';fs.writeFileSync(p, JSON.stringify(j,null,2)+'\n');"

            # Build data & update README stats
            corepack enable
            pnpm install --frozen-lockfile
            pnpm build:data
            bash scripts/build-data-hash.sh
            bash scripts/update-readme-stats.sh "$TAG"

            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add package.json README.md .data-build-hash
            git commit -m "chore(release): $TAG"
            git push origin "HEAD:${GITHUB_REF_NAME}"

            echo "skip_data_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_semver=false" >> "$GITHUB_OUTPUT"
            echo "skip_data_build=false" >> "$GITHUB_OUTPUT"
          fi

          git tag "$TAG"
          git push origin "refs/tags/$TAG"

      - name: If dispatch with tag, checkout it
        if: github.event_name == 'workflow_dispatch' && steps.prep.outputs.has_tag == 'true'
        run: |
          git fetch --tags origin
          git checkout "${{ steps.prep.outputs.tag }}"

      # ── Resolve metadata ─────────────────────────────────
      - name: Resolve
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "push" && "${GITHUB_REF}" == refs/tags/* ]]; then
            # Tag push: GITHUB_REF_NAME is the tag, not a branch.
            # develop branch was removed — releases only ever target main.
            BRANCH="main"
            TAG="${GITHUB_REF_NAME}"
            echo "branch=$BRANCH"  >> "$GITHUB_OUTPUT"
            echo "tag=$TAG"        >> "$GITHUB_OUTPUT"
            echo "has_tag=true"    >> "$GITHUB_OUTPUT"
            if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              VERSION="${TAG#v}"
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
              echo "major_minor=$(echo "$VERSION" | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"
              echo "has_semver=true"  >> "$GITHUB_OUTPUT"
            else
              echo "has_semver=false" >> "$GITHUB_OUTPUT"
            fi
          else
            BRANCH="${GITHUB_REF_NAME}"
            echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
            if [[ "${{ steps.prep.outputs.has_tag }}" == "true" ]]; then
              echo "tag=${{ steps.prep.outputs.tag }}"        >> "$GITHUB_OUTPUT"
              echo "has_tag=true"                              >> "$GITHUB_OUTPUT"
              if [[ "${{ steps.prep.outputs.is_semver }}" == "true" ]]; then
                echo "version=${{ steps.prep.outputs.version }}" >> "$GITHUB_OUTPUT"
                echo "major_minor=$(echo "${{ steps.prep.outputs.version }}" | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"
                echo "has_semver=true"                            >> "$GITHUB_OUTPUT"
              else
                echo "has_semver=false" >> "$GITHUB_OUTPUT"
              fi
            else
              echo "has_tag=false"   >> "$GITHUB_OUTPUT"
              echo "has_semver=false" >> "$GITHUB_OUTPUT"
            fi
          fi

          if [[ "$BRANCH" == "main" ]]; then
            echo "is_main=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_main=false" >> "$GITHUB_OUTPUT"
          fi

          SHA="$(git rev-parse --short HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # ── Docker build & push ──────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ steps.resolve.outputs.is_main == 'true' }}
            type=raw,value=${{ steps.resolve.outputs.version }},enable=${{ steps.resolve.outputs.has_semver == 'true' }}
            type=raw,value=${{ steps.resolve.outputs.major_minor }},enable=${{ steps.resolve.outputs.has_semver == 'true' }}
            type=raw,value=${{ steps.resolve.outputs.tag }},enable=${{ steps.resolve.outputs.has_semver == 'false' && steps.resolve.outputs.has_tag == 'true' }}
            type=raw,value=${{ steps.resolve.outputs.sha }},enable=${{ steps.resolve.outputs.is_main == 'false' && steps.resolve.outputs.has_tag == 'false' }}

      - name: Determine platforms
        id: platforms
        run: |
          if [[ "${{ steps.resolve.outputs.is_main }}" == "true" ]]; then
            echo "list=linux/amd64,linux/arm64,linux/arm/v7" >> "$GITHUB_OUTPUT"
          else
            echo "list=linux/amd64" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        if: github.event_name != 'schedule' || steps.changes.outputs.has_changes == 'true'
        uses: docker/build-push-action@v7
        with:
          provenance: false
          sbom: false
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: ${{ steps.platforms.outputs.list }}
          build-args: |
            SKIP_DATA_BUILD=${{ steps.prep.outputs.skip_data_build == 'true' && 'true' || 'false' }}
